name: Daily patch update check
permissions: write-all
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
jobs:
  check:
    name: Check upstream patch updates
    runs-on: ubuntu-latest
    env:
      repository: ${{ github.repository }}
    outputs:
      anddea_youtube: ${{ steps.anddea-youtube.outputs.new_patch }}
      anddea_music: ${{ steps.anddea-music.outputs.new_patch }}
      anddea_youtube_beta: ${{ steps.anddea-youtube-beta.outputs.new_patch }}
      anddea_music_beta: ${{ steps.anddea-music-beta.outputs.new_patch }}
      piko_instagram: ${{ steps.piko-instagram.outputs.new_patch }}
      piko_instagram_beta: ${{ steps.piko-instagram-beta.outputs.new_patch }}
      piko_newx: ${{ steps.piko-newx.outputs.new_patch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Check GitHub connection
        id: check-gh
        run: bash src/etc/connection.sh
      - name: Check Anddea stable YouTube patch updates
        id: anddea-youtube
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh anddea/revanced-patches latest youtube-stable-arm64-v8a-anddea.apk
      - name: Check Anddea stable YouTube Music patch updates
        id: anddea-music
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh anddea/revanced-patches latest youtube-music-stable-arm64-v8a-anddea.apk
      - name: Check Anddea beta YouTube patch updates
        id: anddea-youtube-beta
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh anddea/revanced-patches prerelease youtube-beta-arm64-v8a-anddea.apk
      - name: Check Anddea beta YouTube Music patch updates
        id: anddea-music-beta
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh anddea/revanced-patches prerelease youtube-music-beta-arm64-v8a-anddea.apk
      - name: Check Instagram Piko stable patch updates
        id: piko-instagram
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh crimera/piko latest instagram-arm64-v8a-piko.apk
      - name: Check Instagram Piko beta patch updates
        id: piko-instagram-beta
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh crimera/piko prerelease instagram-beta-arm64-v8a-piko.apk
      - name: Check Twitter Piko NewX patch updates
        id: piko-newx
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh crimera/piko-newx latest twitter-piko-newx.apk
  build-youtube:
    needs: check
    if: needs.check.outputs.anddea_youtube == '1'
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      app: YouTube Anddea Stable
  build-youtube-music:
    needs: check
    if: needs.check.outputs.anddea_music == '1'
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      app: YouTube Music Anddea Stable
  build-youtube-beta:
    needs: check
    if: needs.check.outputs.anddea_youtube_beta == '1'
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      app: YouTube Anddea Beta
  build-youtube-music-beta:
    needs: check
    if: needs.check.outputs.anddea_music_beta == '1'
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      app: YouTube Music Anddea Beta
  build-instagram:
    needs: check
    if: needs.check.outputs.piko_instagram == '1'
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      app: Instagram Piko Stable
  build-instagram-beta:
    needs: check
    if: needs.check.outputs.piko_instagram_beta == '1'
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      app: Instagram Piko Beta
  build-twitter-newx:
    needs: check
    if: needs.check.outputs.piko_newx == '1'
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      app: Twitter Piko NewX
