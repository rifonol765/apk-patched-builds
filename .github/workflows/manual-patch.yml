name: Build selected app
permissions: write-all
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to build (all available patches are enabled by default)
        required: true
        type: choice
        options:
          - Instagram Piko
          - Twitter Piko NewX
          - YouTube Anddea
          - YouTube Music Anddea
  workflow_call:
    inputs:
      app:
        required: true
        type: string
jobs:
  instagram-piko:
    if: inputs.app == 'Instagram Piko'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/preparing
      - name: Check GitHub connection
        id: connection
        run: bash src/etc/connection.sh
      - name: Build Instagram Piko with all available patches
        if: steps.connection.outputs.internet_error == '0'
        run: bash src/build/Piko.sh 2
      - name: Publish APK
        if: steps.connection.outputs.internet_error == '0'
        uses: ./.github/actions/release
  twitter-piko-newx:
    if: inputs.app == 'Twitter Piko NewX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/preparing
      - name: Check GitHub connection
        id: connection
        run: bash src/etc/connection.sh
      - name: Build Twitter Piko NewX with all available patches
        if: steps.connection.outputs.internet_error == '0'
        run: bash src/build/Piko-Newx.sh
      - name: Publish APK
        if: steps.connection.outputs.internet_error == '0'
        uses: ./.github/actions/release
  youtube-anddea:
    if: inputs.app == 'YouTube Anddea'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/preparing
      - name: Check GitHub connection
        id: connection
        run: bash src/etc/connection.sh
      - name: Build YouTube Anddea with all available patches
        if: steps.connection.outputs.internet_error == '0'
        run: bash src/build/Anddea-Revanced-Extended.sh 1
      - name: Publish APK
        if: steps.connection.outputs.internet_error == '0'
        uses: ./.github/actions/release
  youtube-music-anddea:
    if: inputs.app == 'YouTube Music Anddea'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: ./.github/actions/preparing
      - name: Check GitHub connection
        id: connection
        run: bash src/etc/connection.sh
      - name: Build YouTube Music Anddea with all available patches
        if: steps.connection.outputs.internet_error == '0'
        run: bash src/build/Anddea-Revanced-Extended.sh 2
      - name: Publish APK
        if: steps.connection.outputs.internet_error == '0'
        uses: ./.github/actions/release
